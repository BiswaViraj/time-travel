<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    path,line,circle{stroke:#18181b;fill:none;stroke-linecap:round;stroke-linejoin:round}
    polygon{fill:#18181b;stroke:none}
    circle.dot{fill:#18181b}
    @media(prefers-color-scheme:dark){
      path,line,circle{stroke:#f4f4f5}
      polygon{fill:#f4f4f5}
      circle.dot{fill:#f4f4f5}
    }
  </style>
  <!-- CCW arc from ~1 o'clock sweeping 300° to ~11 o'clock -->
  <path d="M86 27.5A44 44 0 1 0 100 52" stroke-width="11"/>
  <!-- Arrowhead at the start (pointing up-left, CCW direction) -->
  <polygon points="74,14 86,28 100,14" transform="rotate(-2,86,27.5)"/>
  <!-- Clock hand pointing to ~10 o'clock -->
  <line x1="64" y1="64" x2="48" y2="40" stroke-width="9"/>
  <!-- Center dot -->
  <circle class="dot" cx="64" cy="64" r="5.5"/>
</svg>
